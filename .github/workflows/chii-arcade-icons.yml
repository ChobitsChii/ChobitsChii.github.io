name: Generate Chii Arcade website icons

on:
  push:
    branches: [main, feat/chii-arcade-website-branding]
    paths:
      - 'chii-arcade/assets/branding/chii-arcade-icon.webp'
      - 'chii-arcade/tools/generate_site_icons.py'
      - '.github/workflows/chii-arcade-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install icon generator
        run: python3 -m pip install --user "Pillow>=10,<13"
      - name: Generate favicon and touch icon variants
        run: python3 chii-arcade/tools/generate_site_icons.py
      - name: Validate generated variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root = Path("chii-arcade")
          expected = {
              "favicon-16x16.png": (16, 16),
              "favicon-32x32.png": (32, 32),
              "apple-touch-icon.png": (180, 180),
              "android-chrome-192x192.png": (192, 192),
              "android-chrome-512x512.png": (512, 512),
              "android-chrome-maskable-512x512.png": (512, 512),
          }
          for path, size in expected.items():
              with Image.open(root / path) as image:
                  assert image.size == size, (path, image.size)
          with Image.open(root / "favicon.ico") as icon:
              assert icon.size == (48, 48)
          assert (root / "favicon.svg").read_text().startswith("<svg ")
          manifest = json.loads((root / "site.webmanifest").read_text())
          for entry in manifest["icons"]:
              assert (root / entry["src"]).is_file(), entry
          print("All standard favicon, Apple touch and PWA icon variants validated.")
          PY
      - name: Commit generated image assets
        run: |
          git add chii-arcade/favicon.ico chii-arcade/favicon.svg \
            chii-arcade/favicon-16x16.png chii-arcade/favicon-32x32.png \
            chii-arcade/apple-touch-icon.png \
            chii-arcade/android-chrome-192x192.png \
            chii-arcade/android-chrome-512x512.png \
            chii-arcade/android-chrome-maskable-512x512.png
          if git diff --cached --quiet; then
            echo "Icons are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(arcade): generate favicon, Apple and PWA icon variants"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
